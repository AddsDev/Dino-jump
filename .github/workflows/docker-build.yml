name: Docker Build & Publish

on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]

# Permissions needed to write packages to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  dino-web:
    name: Build & Publish dino-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dynamic Image Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          TAGS="ghcr.io/${REPO_LOWER}/dino-web:dev-${SHA_SHORT}"

          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}/dino-web:latest"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}/dino-web:dev-latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push dino-web Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dino-api:
    name: Build & Publish dino-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Dynamic Image Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          TAGS="ghcr.io/${REPO_LOWER}/dino-api:dev-${SHA_SHORT}"

          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}/dino-api:latest"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            TAGS="${TAGS},ghcr.io/${REPO_LOWER}/dino-api:dev-latest"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and Push dino-api Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
