name: Deploy QA

# Triggers:
#   - Push to a release/** branch (e.g. release/qa, release/v1.2.0)
#   - Manual dispatch (Run workflow)
# Reuses the CI workflow as a quality gate via `workflow_run`.

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch or tag)'
        required: false
        default: 'develop'

concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push QA Images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve Commit SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API Image (qa-${{ steps.sha.outputs.sha }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runner
          tags: |
            ghcr.io/${{ github.repository_owner }}/dino-api:qa-${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/dino-api:qa-latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web Image (qa-${{ steps.sha.outputs.sha }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ vars.QA_API_BASE_URL || 'http://localhost:3002' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dino-web:qa-${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/dino-web:qa-latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Migrate Image (qa-${{ steps.sha.outputs.sha }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          tags: |
            ghcr.io/${{ github.repository_owner }}/dino-migrate:qa-${{ steps.sha.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/dino-migrate:qa-latest
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
