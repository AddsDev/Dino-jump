name: Continuous Integration

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  validate-web:
    name: Web - Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Verify Project Typescript & Compilation
        run: npm run build --workspace apps/web

      - name: Execute Vitest Automated Suites
        run: npm run test --workspace apps/web

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-dev
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  validate-api:
    name: API - Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dino
          POSTGRES_PASSWORD: dino
          POSTGRES_DB: dino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dino -d dino_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dino:dino@localhost:5432/dino_test
      NODE_ENV: test
      APP_ENV: dev
      API_PORT: 3001
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply Prisma Migrations
        run: npm run prisma:deploy

      - name: Verify API Typescript & Compilation
        run: npm run build --workspace apps/api

      - name: Execute API Automated Suites
        run: npm run test --workspace apps/api

      - name: Upload API Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build-dev
          path: apps/api/dist
          if-no-files-found: error
          retention-days: 7
