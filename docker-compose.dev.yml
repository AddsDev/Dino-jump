services:
  db:
    image: postgres:16-alpine
    container_name: dino-db-dev
    environment:
      POSTGRES_USER: dino
      POSTGRES_PASSWORD: dino
      POSTGRES_DB: dino_dev
    ports:
      - "5432:5432"
    volumes:
      - dino-db-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dino -d dino_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dino-api-dev
    environment:
      NODE_ENV: development
      APP_ENV: dev
      API_PORT: 3001
      DATABASE_URL: postgresql://dino:dino@db:5432/dino_dev
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dino-web-dev
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dino-db-dev-data:
